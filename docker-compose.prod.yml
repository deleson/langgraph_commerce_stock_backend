x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    container_name: langgraph_commerce_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langgraph_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_commerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - langgraph_commerce_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langgraph_app} -d ${POSTGRES_DB:-langgraph_commerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7
    container_name: langgraph_commerce_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - langgraph_commerce_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph_commerce_api_prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV_FILE: .env.production
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langgraph_commerce_prod
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph_commerce_worker_prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV_FILE: .env.production
    command: >
      uv run celery
      -A app.core.celery_app.celery_app
      worker
      --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langgraph_commerce_prod
    logging: *default-logging

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph_commerce_beat_prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV_FILE: .env.production
    command: >
      uv run celery
      -A app.core.celery_app.celery_app
      beat
      --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langgraph_commerce_prod
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: langgraph_commerce_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - langgraph_commerce_prod
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

networks:
  langgraph_commerce_prod:
    driver: bridge