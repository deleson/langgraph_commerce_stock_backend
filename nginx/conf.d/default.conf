server {
    # 第一版没有域名和 HTTPS，因此监听公网 HTTP 80。
    listen 80;
    server_name _;

    # 限制请求体大小，避免异常大请求拖垮 API。
    client_max_body_size 10m;

    # AI、回测、候选评分等接口可能比普通 CRUD 慢，因此读超时稍长。
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        # api 是 docker-compose.prod.yml 中的服务名，不是公网域名。
        # Nginx 通过 Docker 内部网络访问 FastAPI 8000，公网不会直接暴露 8000。
        proxy_pass http://api:8000;

        proxy_http_version 1.1;

        # 保留真实客户端信息，方便 FastAPI 日志和后续审计。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 预留 WebSocket / 升级连接支持，普通 HTTP API 也可以正常使用。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
