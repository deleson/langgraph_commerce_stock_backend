[project]
name = "langgraph-commerce-backend"
version = "0.1.0"
description = "Backend service for the LangGraph commerce project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.31.0",
    "baostock>=0.9.1",
    "email-validator>=2.3.0",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "redis>=7.4.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.44.0",
]

[tool.uv]
package = false
